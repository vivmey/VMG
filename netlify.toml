[build]
  command = "npm install sharp --platform=linux --arch=x64 && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20.11.0"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/api/posts"
  [headers.values]
    Cache-Control = "public, s-maxage=300, stale-while-revalidate=600"

[[headers]]
  for = "/forms/*"
  [headers.values]
    Cache-Control = "no-store"

# Note : 207 redirects 301 Blogspot → nouveaux slugs blog
# sont stockés dans redirects.toml à la racine du repo et chargés automatiquement par Netlify.
