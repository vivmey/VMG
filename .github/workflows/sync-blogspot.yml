name: Sync articles Blogspot

on:
  workflow_dispatch: {}
  schedule:
    # Chaque lundi à 6h00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run sync script
        run: npx tsx scripts/sync-blogspot.ts

      - name: Commit new articles
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/posts/
          if git diff --staged --quiet; then
            echo "Aucun nouvel article à importer."
          else
            COUNT=$(git diff --staged --name-only | wc -l | tr -d ' ')
            git commit -m "Sync: import ${COUNT} nouveaux articles depuis Blogspot"
            git push
          fi
