name: Patch images articles

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run patch script
        run: npx tsx scripts/patch-images.ts

      - name: Commit patched articles
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add content/posts/
          if git diff --staged --quiet; then
            echo "Aucun article à patcher."
          else
            COUNT=$(git diff --staged --name-only | wc -l | tr -d ' ')
            git commit -m "Patch: ajout image frontmatter sur ${COUNT} articles"
            git push
          fi
