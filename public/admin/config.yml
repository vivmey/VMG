# =============================================================================
# Decap CMS — Configuration Voisins Moulin Galant
# =============================================================================
# Authentification via Netlify Identity + Git Gateway
# Doc : https://decapcms.org/docs/

backend:
  name: git-gateway
  branch: main

# Images uploadées dans public/images/uploads/
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# Interface en français
locale: fr

# Génération des slugs : minuscules, sans accents, tirets
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# =============================================================================
# COLLECTIONS
# =============================================================================

collections:

  # ---------------------------------------------------------------------------
  # ARTICLES DU BLOG
  # Les fichiers sont créés dans content/posts/<categorie>/YYYY-MM-DD-slug.mdx
  # ---------------------------------------------------------------------------
  - name: "articles"
    label: "📝 Articles du blog"
    label_singular: "Article"
    folder: "content/posts"
    create: true
    # Organise les articles dans un sous-dossier par catégorie
    path: "{{fields.category}}/{{year}}-{{month}}-{{day}}-{{slug}}"
    nested:
      depth: 2
      summary: "{{title}}"
    extension: "mdx"
    format: "frontmatter"
    preview_path: "/fr/blog/{{slug}}"
    summary: "{{title}} — {{fields.category}} — {{publishedAt}}"
    sortable_fields: ["publishedAt", "title", "category"]
    fields:
      - label: "Titre"
        name: "title"
        widget: "string"
        hint: "Maximum 80 caractères"

      - label: "Résumé"
        name: "description"
        widget: "string"
        hint: "Affiché dans la liste et sur Google (max 160 caractères)"

      - label: "Date de publication"
        name: "publishedAt"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        default: ""

      - label: "Auteur"
        name: "author"
        widget: "string"
        default: "Voisins Moulin Galant"

      - label: "Catégorie"
        name: "category"
        widget: "select"
        options:
          - { label: "Actualités", value: "actualites" }
          - { label: "Événements", value: "evenements" }
          - { label: "Aide alimentaire", value: "aide-alimentaire" }
          - { label: "Friperie solidaire", value: "friperie" }
          - { label: "Mobilisation", value: "mobilisation" }
          - { label: "Vie de l'asso", value: "vie-asso" }
          - { label: "Communiqué", value: "communique" }
          - { label: "Galerie", value: "galerie" }

      - label: "Image principale"
        name: "image"
        widget: "image"
        required: false
        hint: "Idéalement 1200×630px — JPG ou PNG"
        media_library:
          config:
            multiple: false

      - label: "Temps de lecture (minutes)"
        name: "readingTime"
        widget: "number"
        default: 2
        min: 1
        max: 60
        value_type: "int"

      - label: "Brouillon (non visible sur le site)"
        name: "draft"
        widget: "boolean"
        default: false
        hint: "Activé = l'article n'apparaît pas sur le site"

      - label: "Mots-clés"
        name: "keywords"
        widget: "list"
        required: false
        hint: "Séparés par Entrée — ex: friperie, solidarité"

      - label: "Langue"
        name: "language"
        widget: "hidden"
        default: "fr"

      - label: "Contenu de l'article"
        name: "body"
        widget: "markdown"
        hint: "Utilisez ## pour les titres de sections, **texte** pour le gras"

  # ---------------------------------------------------------------------------
  # TEXTES DU SITE VITRINE
  # Édite directement public/locales/fr/common.json
  # IMPORTANT : tous les champs doivent être présents pour ne pas perdre de données
  # ---------------------------------------------------------------------------
  - name: "settings"
    label: "⚙️ Textes du site"
    files:

      - name: "textes"
        label: "Contenu des pages"
        file: "public/locales/fr/common.json"
        fields:

          # ---- Identité de l'asso ----
          - label: "Identité"
            name: "brand"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Nom complet", name: "name", widget: "string" }
              - { label: "Nom court", name: "shortName", widget: "string" }
              - { label: "Slogan", name: "tagline", widget: "string" }

          # ---- Navigation ----
          - label: "Navigation"
            name: "nav"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Accueil", name: "home", widget: "string" }
              - { label: "Qui sommes-nous", name: "about", widget: "string" }
              - { label: "Nos actions", name: "actions", widget: "string" }
              - { label: "Blog", name: "blog", widget: "string" }
              - { label: "Contact", name: "contact", widget: "string" }
              - { label: "Faire un don", name: "donate", widget: "string" }
              - { label: "Écrire un message", name: "callUs", widget: "string" }

          # ---- Section Hero (page d'accueil) ----
          - label: "Section Accueil — Textes du bandeau principal"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Titre ligne 1", name: "title1", widget: "string" }
              - { label: "Titre ligne 2", name: "title2", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Bouton principal", name: "cta", widget: "string" }
              - { label: "Bouton secondaire", name: "ctaSecondary", widget: "string" }
              - { label: "Bouton adhésion", name: "ctaAdhere", widget: "string" }
              - { label: "Grand texte décoratif", name: "giantText", widget: "string" }

          # ---- Chiffres clés ----
          - label: "Chiffres clés"
            name: "stats"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Libellé familles", name: "familles", widget: "string" }
              - { label: "Libellé événements", name: "evenements", widget: "string" }
              - { label: "Libellé années", name: "annees", widget: "string" }

          # ---- Valeurs ----
          - label: "Section Valeurs"
            name: "valueProps"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Solidarité — Titre", name: "solidariteTitle", widget: "string" }
              - { label: "Solidarité — Description", name: "solidariteDesc", widget: "string" }
              - { label: "Communauté — Titre", name: "communauteTitle", widget: "string" }
              - { label: "Communauté — Description", name: "communauteDesc", widget: "string" }
              - { label: "Cadre de vie — Titre", name: "environnementTitle", widget: "string" }
              - { label: "Cadre de vie — Description", name: "environnementDesc", widget: "string" }
              - { label: "Événements — Titre", name: "evenementsTitle", widget: "string" }
              - { label: "Événements — Description", name: "evenementsDesc", widget: "string" }
              - { label: "Mobilisation — Titre", name: "mobilisationTitle", widget: "string" }
              - { label: "Mobilisation — Description", name: "mobilisationDesc", widget: "string" }
              - { label: "Ancrage local — Titre", name: "localTitle", widget: "string" }
              - { label: "Ancrage local — Description", name: "localDesc", widget: "string" }

          # ---- Pourquoi nous rejoindre ----
          - label: "Section Pourquoi nous rejoindre"
            name: "whyUs"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string" }
              - { label: "Argument 1 — Titre", name: "benefit1Title", widget: "string" }
              - { label: "Argument 1 — Description", name: "benefit1Desc", widget: "text" }
              - { label: "Argument 2 — Titre", name: "benefit2Title", widget: "string" }
              - { label: "Argument 2 — Description", name: "benefit2Desc", widget: "text" }
              - { label: "Argument 3 — Titre", name: "benefit3Title", widget: "string" }
              - { label: "Argument 3 — Description", name: "benefit3Desc", widget: "text" }
              - { label: "Badge années", name: "yearsBadge", widget: "string" }

          # ---- Nos actions ----
          - label: "Section Nos actions"
            name: "actions"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Titre ligne 1", name: "title", widget: "string" }
              - { label: "Titre ligne 2", name: "subtitle", widget: "string" }
              - { label: "Aide alimentaire — Titre", name: "aideAlimentaireTitle", widget: "string" }
              - { label: "Aide alimentaire — Description", name: "aideAlimentaireDesc", widget: "text" }
              - { label: "Friperie — Titre", name: "friperieTitle", widget: "string" }
              - { label: "Friperie — Description", name: "friperieDesc", widget: "text" }
              - { label: "Événements — Titre", name: "evenementsTitle", widget: "string" }
              - { label: "Événements — Description", name: "evenementsDesc", widget: "text" }
              - { label: "Mobilisation — Titre", name: "mobilisationTitle", widget: "string" }
              - { label: "Mobilisation — Description", name: "mobilisationDesc", widget: "text" }
              - { label: "Lien 'En savoir plus'", name: "readMore", widget: "string" }

          # ---- Processus d'adhésion ----
          - label: "Section Découvrir / Adhérer / Agir"
            name: "process"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre ligne 1", name: "titleLine1", widget: "string" }
              - { label: "Titre ligne 2", name: "titleLine2", widget: "string" }
              - { label: "Découvrir — Titre", name: "decouvrirTitle", widget: "string" }
              - { label: "Découvrir — Description", name: "decouvrirDesc", widget: "text" }
              - { label: "Adhérer — Titre", name: "adhererTitle", widget: "string" }
              - { label: "Adhérer — Description", name: "adhererDesc", widget: "text" }
              - { label: "S'engager — Titre", name: "engagerTitle", widget: "string" }
              - { label: "S'engager — Description", name: "engagerDesc", widget: "text" }
              - { label: "Agir — Titre", name: "agirTitle", widget: "string" }
              - { label: "Agir — Description", name: "agirDesc", widget: "text" }

          # ---- Carte du quartier ----
          - label: "Section Carte du quartier"
            name: "neighborhood"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string" }
              - { label: "Parc de la Papeterie — Nom", name: "parcPapeterie", widget: "string" }
              - { label: "Parc de la Papeterie — Description", name: "parcPapeterieDesc", widget: "string" }
              - { label: "Point de distribution — Nom", name: "distribution", widget: "string" }
              - { label: "Point de distribution — Description", name: "distributionDesc", widget: "string" }
              - { label: "Friperie — Nom", name: "friperie", widget: "string" }
              - { label: "Friperie — Description", name: "friperieDesc", widget: "string" }
              - { label: "Mairie — Nom", name: "mairie", widget: "string" }
              - { label: "Mairie — Description", name: "mairieDesc", widget: "string" }

          # ---- Partenaires ----
          - label: "Section Partenaires"
            name: "partners"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string" }
              - { label: "Merenza — Nom", name: "merenza", widget: "string" }
              - { label: "Merenza — Description", name: "merenzaDesc", widget: "string" }
              - { label: "Mairie — Nom", name: "mairie", widget: "string" }
              - { label: "Mairie — Description", name: "mairieDesc", widget: "string" }
              - { label: "Département — Nom", name: "departement", widget: "string" }
              - { label: "Département — Description", name: "departementDesc", widget: "string" }
              - { label: "CAF — Nom", name: "caf", widget: "string" }
              - { label: "CAF — Description", name: "cafDesc", widget: "string" }

          # ---- Témoignage ----
          - label: "Témoignage"
            name: "testimonial"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Citation", name: "quote", widget: "text" }
              - { label: "Prénom / Nom", name: "author", widget: "string" }
              - { label: "Rôle (ex : Membre depuis 2021)", name: "role", widget: "string" }

          # ---- FAQ ----
          - label: "FAQ — Questions fréquentes"
            name: "faq"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Introduction", name: "intro", widget: "text" }
              - { label: "Question 1", name: "q1", widget: "string" }
              - { label: "Réponse 1", name: "a1", widget: "text" }
              - { label: "Question 2", name: "q2", widget: "string" }
              - { label: "Réponse 2", name: "a2", widget: "text" }
              - { label: "Question 3", name: "q3", widget: "string" }
              - { label: "Réponse 3", name: "a3", widget: "text" }
              - { label: "Question 4", name: "q4", widget: "string" }
              - { label: "Réponse 4", name: "a4", widget: "text" }
              - { label: "Question 5", name: "q5", widget: "string" }
              - { label: "Réponse 5", name: "a5", widget: "text" }
              - { label: "Question 6", name: "q6", widget: "string" }
              - { label: "Réponse 6", name: "a6", widget: "text" }

          # ---- Appel à l'action ----
          - label: "Section Appel à l'action (bas de page d'accueil)"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string" }
              - { label: "Bouton Don", name: "donate", widget: "string" }
              - { label: "Bouton Adhésion", name: "adhere", widget: "string" }
              - { label: "Bouton Bénévolat", name: "volunteer", widget: "string" }
              - { label: "Description Don", name: "donateDesc", widget: "string" }
              - { label: "Description Adhésion", name: "adhereDesc", widget: "string" }
              - { label: "Description Bénévolat", name: "volunteerDesc", widget: "string" }

          # ---- Blog (section homepage) ----
          - label: "Section Blog (page d'accueil)"
            name: "blog"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string" }
              - { label: "Lien 'Lire l'article'", name: "readMore", widget: "string" }
              - { label: "Lien 'Voir tous les articles'", name: "viewAll", widget: "string" }
              - { label: "Message si aucun article", name: "fallbackNotice", widget: "string" }

          # ---- Pied de page ----
          - label: "Pied de page (Footer)"
            name: "footer"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Description de l'asso", name: "description", widget: "text" }
              - { label: "Titre colonne Association", name: "assoTitle", widget: "string" }
              - { label: "Titre colonne S'engager", name: "engagementTitle", widget: "string" }
              - { label: "Titre colonne Mentions", name: "legalTitle", widget: "string" }
              - { label: "Lien Qui sommes-nous", name: "about", widget: "string" }
              - { label: "Lien Nos actions", name: "actions", widget: "string" }
              - { label: "Lien Blog", name: "blog", widget: "string" }
              - { label: "Lien Contact", name: "contact", widget: "string" }
              - { label: "Lien Don", name: "don", widget: "string" }
              - { label: "Lien Adhésion", name: "adhesion", widget: "string" }
              - { label: "Lien Bénévolat", name: "benevolat", widget: "string" }
              - { label: "Lien Pétition", name: "petition", widget: "string" }
              - { label: "Lien Mentions légales", name: "mentionsLegales", widget: "string" }
              - { label: "Lien Confidentialité", name: "confidentialite", widget: "string" }
              - { label: "Lien RGPD", name: "rgpd", widget: "string" }
              - { label: "Titre Newsletter", name: "newsletter", widget: "string" }
              - { label: "Texte Newsletter", name: "newsletterText", widget: "string" }
              - { label: "Notre quartier", name: "ourLocation", widget: "string" }
              - { label: "Contact général", name: "generalInquiries", widget: "string" }
              - { label: "Label Permanence", name: "permanenceLabel", widget: "string" }
              - { label: "Label Réponse", name: "supportLabel", widget: "string" }
              - { label: "Copyright", name: "copyright", widget: "string" }
              - { label: "Propulsé par", name: "poweredBy", widget: "string" }

          # ---- Métadonnées SEO ----
          - label: "SEO — Titres et descriptions des pages"
            name: "metadata"
            widget: "object"
            collapsed: true
            hint: "Ces textes apparaissent dans les résultats Google"
            fields:
              - { label: "Titre — Page d'accueil", name: "homeTitle", widget: "string" }
              - { label: "Description — Page d'accueil", name: "homeDescription", widget: "text" }
              - { label: "Titre — Qui sommes-nous", name: "aboutTitle", widget: "string" }
              - { label: "Description — Qui sommes-nous", name: "aboutDescription", widget: "text" }
              - { label: "Titre — Nos actions", name: "actionsTitle", widget: "string" }
              - { label: "Description — Nos actions", name: "actionsDescription", widget: "text" }
              - { label: "Titre — Dons", name: "donsTitle", widget: "string" }
              - { label: "Description — Dons", name: "donsDescription", widget: "text" }
              - { label: "Titre — Adhésion", name: "adhesionTitle", widget: "string" }
              - { label: "Description — Adhésion", name: "adhesionDescription", widget: "text" }
              - { label: "Titre — Bénévolat", name: "benevolatTitle", widget: "string" }
              - { label: "Description — Bénévolat", name: "benevolatDescription", widget: "text" }
              - { label: "Titre — Contact", name: "contactTitle", widget: "string" }
              - { label: "Description — Contact", name: "contactDescription", widget: "text" }
              - { label: "Titre — Mentions légales", name: "mentionsTitle", widget: "string" }
              - { label: "Titre — Confidentialité", name: "confidentialiteTitle", widget: "string" }
              - { label: "Titre — RGPD", name: "rgpdTitle", widget: "string" }
